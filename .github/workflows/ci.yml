name: CI

# Tests and build run on every push (any branch) and pull request; a `v*` tag
# additionally publishes to PyPI and creates a GitHub release, but only once
# the tests and the build have passed.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  python-test:
    name: "🧪 Test Python code (${{ matrix.python }})"
    strategy:
      fail-fast: false
      matrix:
        python:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    runs-on: ubuntu-latest
    steps:
    - name: "📥 Check-out"
      uses: actions/checkout@v4
    - name: "🧰 Install uv and Python"
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python }}
    - name: "🧰 Install dependencies"
      run: uv sync --all-extras --group tests
    - name: "🧪 Test Python code"
      run: uv run pytest --cov=src --cov-report=xml
    - name: "📤 Upload coverage to Codecov"
      uses: codecov/codecov-action@v5
      if: matrix.python == '3.11'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  python-build:
    name: "🏗️ Build Python wheels"
    runs-on: ubuntu-latest
    steps:
    - name: "📥 Check-out"
      uses: actions/checkout@v4
    - name: "🧰 Install Python"
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: "🧰 Install dependencies"
      run: pip install build twine
    - name: "🏗️ Build Python wheels"
      run: python -m build
    - name: "🧪 Check package bundles"
      run: twine check dist/*
    - name: "📤 Upload Python wheels"
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: dist
  python-publish:
    name: "🚀 Publish Python wheels"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
    - python-test
    - python-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: "📥 Download Python wheels"
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist
    - name: "🚀 Publish Python wheels"
      uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    name: "🚀 Create GitHub release"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
    - python-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: "📥 Download Python wheels"
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist
    - name: "🚀 Create GitHub release"
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        files: dist/*
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
        generate_release_notes: true
