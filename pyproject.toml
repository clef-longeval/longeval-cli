[project]
dependencies = [
  "click>=8.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "tqdm>=4.66",
]
description = "Tools for building dynamic information retrieval test collections"
name = "longeval-sci"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
# clax-models 0.1.1 needs flax<0.12, and flax 0.11 fails to import on Python
# 3.14 (PEP 649 annotations), so CLAX is left out there until that changes.
clax = [
  "clax-models>=0.1.1; python_version < '3.14'",
  "jax>=0.6,<0.8; python_version < '3.14'",
  "numpy>=1.26", # a direct requirement, so that `tool.uv.sources` below applies to it
  "torch>=2.2; python_version < '3.14'",
]
postgres = [
  "psycopg[binary]>=3.2",
]
tira = [
  "tira>=0.0.190",
]

[project.scripts]
longeval-cli = "src.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]
tests = [
  "pytest",
  "pytest-cov",
  "ruff>=0.17.3",
  "mypy",
  "bandit[toml]",
]
[tool.hatch.build]
exclude = [
  "/examples",
]
# clax-models depends on torch, whose default Linux wheels pull in ~4 GB of CUDA
# libraries. CLAX runs on JAX here and never needs them: use the CPU-only build.
[tool.uv.sources]
torch = {index = "pytorch-cpu", marker = "sys_platform == 'linux'"}

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
