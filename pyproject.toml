[project]
name = "conf26-longeval-sci"
version = "0.1.0"
description = "New snapshots for the LongEval Sci dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clax>=0.0.6",
    "datasets>=3.1.0",
    "huggingface>=0.0.1",
    "hydra-core>=1.3.2",
    "ipykernel>=6.29.5",
    "pandas>=2.0.3",
    "polars>=1.8.2",
    "psycopg2-binary>=2.9.10",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = [
    "PyClick",
]
