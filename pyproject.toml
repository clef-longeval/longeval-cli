[project]
dependencies = [
  "click>=8.1",
  "sqlalchemy>=2.0",
]
description = "Tools for building dynamic information retrieval test collections"
name = "src"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
longeval-cli = "src.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
